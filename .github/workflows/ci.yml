name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate
        working-directory: ./apps/api

      - name: Run unit tests
        run: pnpm test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate
        working-directory: ./apps/api

      - name: Build all apps
        run: pnpm build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: gcr.io/${{ secrets.GCP_PROJECT_ID }}/truzon-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Admin
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: gcr.io/${{ secrets.GCP_PROJECT_ID }}/truzon-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Public Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/public-web/Dockerfile
          push: true
          tags: gcr.io/${{ secrets.GCP_PROJECT_ID }}/truzon-public-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Pro/CP
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/pro-cp/Dockerfile
          push: true
          tags: gcr.io/${{ secrets.GCP_PROJECT_ID }}/truzon-pro-cp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Deploy to Cloud Run (Staging)
        run: |
          echo "Deploying to staging..."
          # gcloud run deploy truzon-api-staging --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/truzon-api:${{ github.sha }} --region ${{ secrets.GCP_REGION }} --platform managed
          # gcloud run deploy truzon-admin-staging --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/truzon-admin:${{ github.sha }} --region ${{ secrets.GCP_REGION }} --platform managed
          # gcloud run deploy truzon-public-web-staging --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/truzon-public-web:${{ github.sha }} --region ${{ secrets.GCP_REGION }} --platform managed
          # gcloud run deploy truzon-pro-cp-staging --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/truzon-pro-cp:${{ github.sha }} --region ${{ secrets.GCP_REGION }} --platform managed
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to Cloud Run (Production)
        run: |
          echo "Deploying to production..."
          # gcloud run deploy truzon-api --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/truzon-api:${{ github.sha }} --region ${{ secrets.GCP_REGION }} --platform managed
          # gcloud run deploy truzon-admin --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/truzon-admin:${{ github.sha }} --region ${{ secrets.GCP_REGION }} --platform managed
          # gcloud run deploy truzon-public-web --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/truzon-public-web:${{ github.sha }} --region ${{ secrets.GCP_REGION }} --platform managed
          # gcloud run deploy truzon-pro-cp --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/truzon-pro-cp:${{ github.sha }} --region ${{ secrets.GCP_REGION }} --platform managed
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}